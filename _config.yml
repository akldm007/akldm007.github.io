remote_theme: "mmistakes/minimal-mistakes@4.26.2"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

title: SeanLi's Blog
description: A knight wandering in code and life
minimal_mistakes_skin: dark
search: true
words_per_minute: 160
future: true
read_more: "enabled"
author:
  name: Sean Li
  avatar: "/pic/jm.jpg"
  bio: "A knight"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/akldm007"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:sean.li02@sap.com"
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

